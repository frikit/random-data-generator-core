name: tests + coverage

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run; every push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job timeouts only stop hung jobs. Slowest successful runs seen in November 2026: build 5 min,
# native image 3.5 min, API compatibility 1.5 min, examples 2.5 min, and mutation 45 min, whose
# limit is 90 minutes.
jobs:
  build:
    name: Test & Coverage (Java ${{ matrix.java }})
    # The Java 25 entry runs with an empty Gradle user home and no cache, so every change is also
    # verified as a fresh checkout resolves it: strict dependency verification then sees each POM and
    # module file that a warm cache would skip (docs/development/dependency-reproducibility.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
        include:
          # Each entry runs the tests of the Java modules on its Java (-PtestJavaVersion; the build's
          # toolchain is Java 21). Gradle needs Java 21 or later, so the Java 17 entry, the oldest Java
          # those modules run on (javaMinimumVersion in gradle.properties), builds on Java 21.
          - java: '17'
            build-java: '21'
            gradle-args: '-PtestJavaVersion=17'
          - java: '21'
            build-java: '21'
          - java: '25'
            build-java: '25'
            gradle-args: '-PtestJavaVersion=25'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Set up before the build JDK, which stays JAVA_HOME; Gradle finds both as toolchains.
      - name: Set up Java 17 (Temurin) for the tests
        if: matrix.java == '17'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Java ${{ matrix.build-java }} (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ matrix.build-java }}
          distribution: 'temurin'

      # Each job, and each matrix entry, restores the Gradle user home that main saved under its own key
      # (raise the v1 in the key to start every job cold once),
      # so no job waits on a key another job reserved; an older entry of the same job serves when the
      # build inputs changed.
      - name: Restore the Gradle cache
        id: gradle-cache
        if: matrix.java != '25'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify documentation facts
        run: ./scripts/verify_documentation_facts.sh

      - name: Verify repository Markdown links
        run: ./scripts/verify_markdown_links.sh

      - name: Verify pinned build inputs
        run: ./scripts/verify_build_input_pins.sh

      - name: Build and verify
        run: ./gradlew clean build check ${{ matrix.gradle-args }} --stacktrace --console=plain --max-workers=1 --no-daemon -x :benchmarks:test -x :benchmarks:check

      - name: Verify module boundaries
        run: ./scripts/verify_module_boundaries.sh

      # CycloneDX attaches direct-BOM artifacts lazily. Keep SBOM generation in
      # its own Gradle invocation so the build graph cannot consume that variant
      # before the plugin wires its output artifacts.
      - name: Generate and verify release SBOMs
        run: ./gradlew verifyReleaseSboms --stacktrace --console=plain --max-workers=1 --no-daemon

      - name: Upload coverage to Codecov
        if: matrix.java == '21' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/build/jacoco/jacoco.xml
          # Integration modules enforce their own line/branch floors; only core is gated at 100% and uploaded.
          disable_search: true
          fail_ci_if_error: false

      # Only main saves, so a pull request never fills a cache that later runs restore.
      - name: Save the Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' && matrix.java != '25'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  # The build job's `check` runs the same check; this job reports it on its own, so a pull request
  # that breaks the public API of the apiBaselineVersion release shows which declarations it breaks.
  api-compatibility:
    name: Public API Compatibility (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Each job, and each matrix entry, restores the Gradle user home that main saved under its own key
      # (raise the v1 in the key to start every job cold once),
      # so no job waits on a key another job reserved; an older entry of the same job serves when the
      # build inputs changed.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check the public API against the apiBaselineVersion release
        run: ./gradlew checkApiCompatibility --continue --console=plain --max-workers=1 --no-daemon

      # Only main saves, so a pull request never fills a cache that later runs restore.
      - name: Save the Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  native-image:
    name: GraalVM Native Image Smoke (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up GraalVM with Native Image
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Each job, and each matrix entry, restores the Gradle user home that main saved under its own key
      # (raise the v1 in the key to start every job cold once),
      # so no job waits on a key another job reserved; an older entry of the same job serves when the
      # build inputs changed.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and run native-image smoke fixture
        env:
          RDG_REQUIRE_NATIVE_IMAGE: "true"
        run: ./scripts/verify_native_image.sh

      # Only main saves, so a pull request never fills a cache that later runs restore.
      - name: Save the Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  mutation-pilot:
    name: Critical-path Mutation (Java 21)
    runs-on: ubuntu-latest
    # PIT runs on one thread for repeatable results: 29 to 45 minutes on CI, about 17 locally.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Each job, and each matrix entry, restores the Gradle user home that main saved under its own key
      # (raise the v1 in the key to start every job cold once),
      # so no job waits on a key another job reserved; an older entry of the same job serves when the
      # build inputs changed.
      # No fallback key here: when a build input changes, PIT's dependency graph, which only this job
      # resolves, is verified from an empty Gradle home.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Measure critical-path mutation baseline
        run: ./gradlew :core:pitest --console=plain --max-workers=1 --no-daemon

      # Only main saves, so a pull request never fills a cache that later runs restore.
      - name: Save the Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  examples:
    name: Examples (Local Maven Snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # For the Java 17 run of the Java + Gradle example; set up before Java 21, which stays JAVA_HOME.
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Each job, and each matrix entry, restores the Gradle user home that main saved under its own key
      # (raise the v1 in the key to start every job cold once),
      # so no job waits on a key another job reserved; an older entry of the same job serves when the
      # build inputs changed.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.java }}-

      - name: Make gradle wrappers executable
        run: chmod +x gradlew examples/java-gradle/gradlew

      - name: Verify examples against the locally published snapshot
        env:
          RDG_REQUIRE_JAVA17: "true"
        run: ./scripts/verify_examples_local.sh

      # Only main saves, so a pull request never fills a cache that later runs restore.
      - name: Save the Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
